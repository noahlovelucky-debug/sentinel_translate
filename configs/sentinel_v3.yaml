paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  manifest: /data/sentinel_translate/data/manifests/pairs.jsonl
  output: /data/code/sentinel_translate_v3_1/checkpoints
  reports: /data/code/sentinel_translate_v3_1/reports

model:
  width: 64
  hidden: 768
  encoder_depth: 12
  dit_depth: 12
  heads: 12
  flow_steps: 16
  optical_residual_limit: 0.15
  sar_residual_limit_db: 6.0
  architecture: v3.1

train:
  stage: physical
  max_steps: 12000
  batch_size: 32
  gradient_accumulation: 1
  num_workers: 0
  learning_rate: 0.0001
  encoder_learning_rate: 0.00002
  weight_decay: 0.05
  warmup_steps: 2000
  gradient_clip: 1.0
  ema_decay: 0.9999
  init_use_ema: false
  channels_last: false
  save_final: true
  seed: 42
  amp: bfloat16
  log_every: 20
  validate_every: 1000
  save_every: 2000
  task_probabilities: [0.35, 0.35, 0.15, 0.15]
  physical_alignment_samples: 4
