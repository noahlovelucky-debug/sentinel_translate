paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  temporal_prior_shards: /data/sentinel_translate/data/shards_v32_temporal_prior/index.json
  hf_eligibility: /data/sentinel_translate/data/shards_v32_hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_id_utility_smoke
  reports: /data/code/sentinel_translat/v3.2/reports_v32_id_utility_smoke

model:
  id_bridge_enabled: false
  id_bridge_anchor_utility: true
  id_bridge_optical_mid_basis_scale: 0.15
  id_bridge_optical_coarse_basis_scale: 0.05

train:
  stage: id_utility
  max_steps: 2
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0001
  init_use_ema: true
  warmup_steps: 0
  log_every: 1
  save_every: 1000
  save_final: false
  find_unused_parameters: true
  flow_rollout_every: 1
  flow_visual_perceptual_weight: 0.0

validation:
  enabled: false
