paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  temporal_prior_shards: /data/sentinel_translate/data/shards_v32_temporal_prior/index.json
  hf_eligibility: /data/sentinel_translate/data/shards_v32_hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_optical_bridge
  reports: /data/code/sentinel_translat/v3.2/reports_v32_optical_bridge

model:
  flow_noise_scale: 0.35
  optical_flow_noise_scale: 0.05
  sar_flow_noise_scale: 0.35
  optical_bridge_enabled: true
  optical_bridge_density_threshold: 1.0
  optical_texture_risk_threshold: 0.0

train:
  stage: bridge
  max_steps: 5000
  batch_size: 2
  num_workers: 4
  learning_rate: 0.0001
  init_use_ema: true
  warmup_steps: 250
  log_every: 20
  validate_every: 1000
  full_validate_every: 5000
  save_every: 1000
  early_stop_patience: 5
  find_unused_parameters: false
  bridge_flow_steps: 4
  optical_detail_confidence_threshold_override: 1.01
  flow_visual_perceptual_weight: 0.025

validation:
  full_steps: [5000]
