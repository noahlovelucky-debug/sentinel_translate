paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  temporal_prior_shards: /data/sentinel_translate/data/shards_v32_temporal_prior/index.json
  hf_eligibility: /data/sentinel_translate/data/shards_v32_hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_id_utility_connectivity_v1
  reports: /data/code/sentinel_translat/v3.2/reports_v32_id_utility_connectivity_v1

model:
  id_bridge_enabled: false
  id_bridge_anchor_utility: true
  id_bridge_optical_mid_basis_scale: 0.15
  id_bridge_optical_coarse_basis_scale: 0.05

train:
  stage: id_utility
  max_steps: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0001
  init_use_ema: true
  warmup_steps: 10
  ema_decay: 0.99
  log_every: 20
  validate_every: 100
  full_validate_every: 500
  save_every: 100
  early_stop_patience: 5
  find_unused_parameters: true
  flow_rollout_every: 4
  flow_visual_perceptual_weight: 0.025

validation:
  enabled: true
