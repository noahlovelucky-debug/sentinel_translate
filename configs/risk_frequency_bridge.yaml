paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  temporal_prior_shards: /data/sentinel_translate/data/shards_v32_temporal_prior/index.json
  hf_eligibility: /data/sentinel_translate/data/shards_v32_hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_frequency_bridge_v8_risk
  reports: /data/code/sentinel_translat/v3.2/reports_v32_frequency_bridge_v8_risk

model:
  flow_noise_scale: 0.35
  optical_flow_noise_scale: 0.05
  sar_flow_noise_scale: 0.35
  optical_texture_risk_threshold: 0.5

train:
  stage: risk
  max_steps: 5000
  batch_size: 8
  num_workers: 4
  learning_rate: 0.0001
  init_use_ema: true
  warmup_steps: 250
  log_every: 20
  validate_every: 1000
  full_validate_every: 5000
  save_every: 1000
  early_stop_patience: 5
  find_unused_parameters: false
  risk_flow_steps: 4
  optical_detail_confidence_threshold_override: 1.01
  flow_visual_pixel_weight: 0.0
  flow_visual_hf_weight: 0.0
  flow_visual_perceptual_weight: 0.0
  flow_rollout_pixel_weight: 0.0
  flow_rollout_hf_weight: 0.0

validation:
  full_steps: [5000]
