paths:
  train_shards: /data/datasets/sentinel_translate_v32_2017_2024/shards/train/index.json
  manifest: /data/datasets/sentinel_translate_v32_2017_2024/manifests/pairs.jsonl
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_canonical_2017_2024
  reports: /data/code/sentinel_translat/v3.2/reports_v32_canonical_2017_2024

train:
  stage: physical
  max_steps: 20000
  batch_size: 2
  gradient_accumulation: 4
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  amp: bfloat16
  init_use_ema: true
  log_every: 20
  validate_every: 1000
  save_every: 1000
  early_stop_patience: 5
  find_unused_parameters: false
  learning_rate: 0.00001
  adapter_learning_rate: 0.0001
  encoder_learning_rate: 0.000002
  warmup_steps: 1000
  ema_decay: 0.999
  activation_checkpointing: true
  physical_alignment_every: 4
  physical_alignment_samples: 2
  physical_alignment_weight: 0.02
  native_gsd_probability: 0.8
  pcgrad: true
  train_full_resolution_fusion: false
  full_validate_every: 4000

validation:
  split: validation_temporal
  quick_samples: 32
  full_steps: [4000, 8000, 12000, 16000, 20000]
