paths:
  train_shards: /data/datasets/sentinel_translate_v32_2017_2024/shards/train/index.json
  manifest: /data/datasets/sentinel_translate_v32_2017_2024/manifests/pairs.jsonl
  hf_eligibility: /data/datasets/sentinel_translate_v32_2017_2024/hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_canonical_2017_2024
  reports: /data/code/sentinel_translat/v3.2/reports_v32_canonical_2017_2024

train:
  stage: codec
  max_steps: 20000
  batch_size: 8
  gradient_accumulation: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  amp: bfloat16
  init_use_ema: true
  log_every: 20
  validate_every: 1000
  save_every: 1000
  early_stop_patience: 5
  find_unused_parameters: false
  learning_rate: 0.0001
  warmup_steps: 1000
  ema_decay: 0.999
  full_validate_every: 5000

validation:
  full_steps: [5000, 10000, 15000, 20000]
