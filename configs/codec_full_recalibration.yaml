paths:
  train_shards: /data/sentinel_translate/data/shards_v2/train/index.json
  temporal_prior_shards: /data/sentinel_translate/data/shards_v32_temporal_prior/index.json
  hf_eligibility: /data/sentinel_translate/data/shards_v32_hf_eligibility.json
  output: /data/code/sentinel_translat/v3.2/checkpoints_v32_frequency_bridge_v3
  reports: /data/code/sentinel_translat/v3.2/reports_v32_frequency_bridge_v3

model:
  flow_noise_scale: 0.35

train:
  stage: codec
  max_steps: 5000
  batch_size: 16
  num_workers: 4
  learning_rate: 0.00005
  optical_dists_weight: 0.05
  codec_perceptual_every: 8
  warmup_steps: 250
  validate_every: 500
  full_validate_every: 1000
  save_every: 500
  early_stop_patience: 8

validation:
  full_steps: [1000, 2000, 3000, 4000, 5000]
